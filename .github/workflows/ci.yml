name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apm_test
      APM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev/mcp/postgres extras
        run: pip install -e ".[connectors,mcp,postgres]" ruff

      # Restricted to real bugs (syntax errors, undefined names, unused
      # imports) rather than full style enforcement, since this repo has
      # no ruff config yet -- see FAILURES_AND_LESSONS_LEARNED.md-style
      # philosophy of catching mistakes, not imposing an unrelated style
      # rewrite as a side effect of adding CI.
      - name: Lint (ruff, correctness-only ruleset)
        run: ruff check --select=E9,F src tests

      - name: Test
        run: pytest -q
