[project]
name = "apm-connectors"
version = "0.1.0"
description = "APM Connectors & Enterprise Systems — the integration layer (Gmail, Google Calendar, Excel connectors) and its approval-gated API, extracted from the APM MVP so it ships standalone and can be plugged into any reasoning/orchestration layer."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    # Gmail (and shared Google OAuth helper used by Calendar too).
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    # MS Excel via Microsoft Graph.
    "msal>=1.28",
    "requests>=2.31",
    # The small propose/approval/execute LangGraph layer that gates
    # every write (apm_connectors.graph) -- no Anthropic/Claude
    # dependency anywhere in this package.
    "langgraph>=0.2",
    # FastAPI backend.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Local/Google Drive Excel connector: parses/edits .xlsx bytes
    # directly (no cell-range API on either source).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
